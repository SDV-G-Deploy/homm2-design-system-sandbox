<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Archive reading seal</title>
  <desc id="desc">A solar-civic fantasy archive seal with brass frame, vellum ledger, water lens, and route markers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d120c"/>
      <stop offset="0.48" stop-color="#123127"/>
      <stop offset="1" stop-color="#26170d"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.45" stop-color="#c7802a"/>
      <stop offset="1" stop-color="#704018"/>
    </linearGradient>
    <linearGradient id="vellum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3ba"/>
      <stop offset="0.62" stop-color="#e5b961"/>
      <stop offset="1" stop-color="#b8752a"/>
    </linearGradient>
    <radialGradient id="lens" cx="50%" cy="44%" r="52%">
      <stop offset="0" stop-color="#e9fff2" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#b8efe5" stop-opacity="0.82"/>
      <stop offset="0.62" stop-color="#4f9287" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#132c28"/>
    </radialGradient>
    <pattern id="grain" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M2 11c9-6 22-6 38 0M5 30c11 5 23 5 34 0" fill="none" stroke="#7a4b1d" stroke-opacity="0.16" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="720" height="520" rx="28" fill="url(#bg)"/>
  <path d="M42 56h636v408H42z" fill="none" stroke="url(#brass)" stroke-width="10"/>
  <path d="M70 84h580v352H70z" fill="none" stroke="#fff0a8" stroke-opacity="0.18" stroke-width="3"/>

  <path d="M178 150h278l62 62v204H178z" fill="#090605" opacity="0.3"/>
