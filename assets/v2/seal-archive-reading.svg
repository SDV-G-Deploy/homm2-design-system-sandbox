    <circle cx="482" cy="302" r="61" fill="none" stroke="#fff0a8" stroke-opacity="0.7" stroke-width="7"/>
    <path d="M482 205v194M385 302h194M414 234l136 136M550 234L414 370" stroke="#e8fff0" stroke-opacity="0.42" stroke-width="5" stroke-linecap="round"/>
