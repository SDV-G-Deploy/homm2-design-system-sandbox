    <path d="M191 178h210M191 218h250M191 258h214M191 298h170M191 338h236" fill="none" stroke="#6d4219" stroke-opacity="0.48" stroke-width="10" stroke-linecap="round"/>
    <rect x="164" y="132" width="340" height="266" fill="url(#grain)" opacity="0.72"/>
  </g>

