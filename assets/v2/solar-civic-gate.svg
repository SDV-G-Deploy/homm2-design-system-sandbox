<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Solar civic gate</title>
  <desc id="desc">A brass and vellum fantasy gate with water lens, solar mirrors, and civic route markers.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17362f"/>
      <stop offset=".48" stop-color="#2f5549"/>
      <stop offset="1" stop-color="#c88935"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" x2="1">
